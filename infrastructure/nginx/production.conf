map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
resolver 127.0.0.11 valid=10s ipv6=off;
upstream api_backend {
  zone api_backend 64k;
  server api:3001 resolve;
}
upstream web_backend {
  zone web_backend 64k;
  server web:3000 resolve;
}
server {
  listen 80;
  server_name _;
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}
server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 1m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  location /events {
    proxy_pass http://api_backend/events;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 75s;
  }
  # Large exports and member downloads stream for longer than the normal page timeout.
  location ~ ^/v1/(contacts/export|targets/member-exports) {
    proxy_pass http://web_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
  location / {
    proxy_pass http://web_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_read_timeout 45s;
  }
}
